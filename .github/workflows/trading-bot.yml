name: deriv-trading-bot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsx liveRun.ts
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SHARED_SECRET: ${{ secrets.API_SHARED_SECRET }}
