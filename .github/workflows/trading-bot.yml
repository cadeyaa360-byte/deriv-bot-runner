name: deriv-trading-bot
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Run trading bot
        shell: bash
        run: |
          set -o pipefail
          npx tsx liveRun.ts 2>&1 | tee run_output.log
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SHARED_SECRET: ${{ secrets.API_SHARED_SECRET }}
          # ALLOW_REAL_TRADING intentionally NOT set here.
          # Real trading stays blocked until you deliberately add this
          # secret in GitHub repo settings, set to exactly: CONFIRMED
      - name: Notify Telegram
        if: always()
        run: npx tsx notifyTelegram.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

